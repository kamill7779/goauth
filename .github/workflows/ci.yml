name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/identity-service
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/identity-service/go.mod
          cache-dependency-path: services/identity-service/go.sum

      - name: Download modules
        run: go mod download

      - name: Run Go tests
        run: go test ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:admin

      - name: Build frontend
        run: npm run build

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check Markdown local links
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem -Recurse -Filter *.md |
            Where-Object { $_.FullName -notmatch '[/\\](\.git|\.worktrees|node_modules)[/\\]' }
          $errors = @()
          foreach ($file in $files) {
            $text = Get-Content -Raw -LiteralPath $file.FullName
            $matches = [regex]::Matches($text, '\[[^\]]+\]\(([^)]+)\)')
            foreach ($match in $matches) {
              $target = $match.Groups[1].Value.Trim()
              if ($target -match '^(https?:|mailto:|#)') { continue }
              if ($target -match '^<(.+)>$') { $target = $Matches[1] }
              $target = ($target -split '#')[0]
              if ([string]::IsNullOrWhiteSpace($target)) { continue }
              if ($target -match '^[a-zA-Z]+://') { continue }
              $full = Join-Path $file.DirectoryName $target
              if (-not (Test-Path -LiteralPath $full)) {
                $errors += "$($file.FullName): missing link target $target"
              }
            }
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          "Markdown local links OK ($($files.Count) files checked)"

  container:
    name: Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate Compose config
        run: docker compose -f services/identity-service/docker-compose.yml config

      - name: Build identity-service image
        run: docker build -t goauth/identity-service:ci services/identity-service
