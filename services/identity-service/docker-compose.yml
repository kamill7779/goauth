name: goauth-identity

services:
  identity-service:
    image: goauth/identity-service:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      HTTP_ADDR: :8080
      PUBLIC_ISSUER_URL: ${PUBLIC_ISSUER_URL:-http://localhost:${IDENTITY_HTTP_PORT:-8080}}
      BROWSER_LOGIN_URL: ${BROWSER_LOGIN_URL:-/login}
      BROWSER_COOKIE_SECURE: ${BROWSER_COOKIE_SECURE:-}
      MYSQL_DSN: ${MYSQL_DSN:-goauth:goauth@tcp(mysql:3306)/goauth_identity?charset=utf8mb4&parseTime=True&loc=Local}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-}
      JWT_KEY_ID: ${JWT_KEY_ID:-local-dev}
      JWT_KEYSET_DIR: ${JWT_KEYSET_DIR:-}
      JWT_ACTIVE_KEY_ID: ${JWT_ACTIVE_KEY_ID:-}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      BROWSER_SESSION_TTL: ${BROWSER_SESSION_TTL:-12h}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-720h}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_AUTH_LOGIN: ${SMTP_AUTH_LOGIN:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-GET,POST,PUT,PATCH,DELETE}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-Authorization,Content-Type,X-Captcha-Token}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-}
      REGISTRATION_MODE: ${REGISTRATION_MODE:-open}
      LOCAL_PASSWORD_LOGIN_ENABLED: ${LOCAL_PASSWORD_LOGIN_ENABLED:-true}
      MAILER_PROVIDER: ${MAILER_PROVIDER:-console}
      BRAND_NAME: ${BRAND_NAME:-GoAuth}
      BRAND_TAGLINE: ${BRAND_TAGLINE:-}
      BRAND_ICON_TEXT: ${BRAND_ICON_TEXT:-G}
      BRAND_ICON_URL: ${BRAND_ICON_URL:-}
      GITHUB_OAUTH_ENABLED: ${GITHUB_OAUTH_ENABLED:-false}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-}
      DEFAULT_MEMBER_TENANT_SLUGS: ${DEFAULT_MEMBER_TENANT_SLUGS:-}
      CAPTCHA_PROVIDER: ${CAPTCHA_PROVIDER:-}
      CAPTCHA_SECRET_KEY: ${CAPTCHA_SECRET_KEY:-}
      CAPTCHA_SITE_KEY: ${CAPTCHA_SITE_KEY:-}
      CAPTCHA_ACTIONS: ${CAPTCHA_ACTIONS:-login,register,email_code,password_forgot}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_NICKNAME: ${BOOTSTRAP_ADMIN_NICKNAME:-}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-}
      BOOTSTRAP_ADMIN_ROLE: ${BOOTSTRAP_ADMIN_ROLE:-root}
      LOCKOUT_THRESHOLD: ${LOCKOUT_THRESHOLD:-5}
      LOCKOUT_DURATION: ${LOCKOUT_DURATION:-15m}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-8}
      PASSWORD_REQUIRE_UPPERCASE: ${PASSWORD_REQUIRE_UPPERCASE:-false}
      PASSWORD_REQUIRE_LOWERCASE: ${PASSWORD_REQUIRE_LOWERCASE:-false}
      PASSWORD_REQUIRE_DIGIT: ${PASSWORD_REQUIRE_DIGIT:-true}
      PASSWORD_REQUIRE_SPECIAL: ${PASSWORD_REQUIRE_SPECIAL:-false}
      PASSWORD_HISTORY_COUNT: ${PASSWORD_HISTORY_COUNT:-3}
      DEFAULT_LOCALE: ${DEFAULT_LOCALE:-en}
    ports:
      - "${IDENTITY_HTTP_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/readyz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-goauth-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-goauth_identity}
      MYSQL_USER: ${MYSQL_USER:-goauth}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-goauth}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  mysql-data:
  redis-data:
